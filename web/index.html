<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/css/app.css">

      </div>
      <nav id="nav">

        <a data-page="dashboard" href="#"><span class="ni">◉</span> Dashboard</a>

        <a data-page="exports" href="#"><span class="ni">⇩</span> Exports</a>

        <a data-page="learn" href="#"><span class="ni">◆</span> Learn DR</a>
        <a data-page="settings" href="#"><span class="ni">⚙</span> Settings</a>

      <div class="sidebar-foot"><span id="version"></span></div>
    </aside>
    <main id="outlet"><div class="loading">Loading…</div></main>
  </div>
  <div id="toasts"></div>
  <script type="module" src="/js/app.js"></script>

</html>
